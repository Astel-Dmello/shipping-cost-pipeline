models:
  - name: "Multiple Linear Regression (MLR)"
    family: linear
    library_target: "sklearn.linear_model.LinearRegression"
    hyperparameters:
      note: "no specific hyperparameters stated beyond standard OLS; multicollinearity handled upstream via VIF filtering"
    input_variable_set: "01_data_schema.yaml -> variable_selection (per branch: correlation-analysis or stepwise, each x listwise/mean-imputation), post-VIF-removal"

  - name: "Deep Neural Network (DNN)"
    family: neural_net
    library_target: "tensorflow.keras Sequential MLP"
    hyperparameters:
      hidden_layers: [256, 128, 64, 32, 16]
      optimizer: Adam
      epochs: 500
      batch_size: 256
      learning_rate: 0.001
    input_variable_set: "same 4 branches as MLR (not VIF-filtered per paper text)"

  - name: "XGBoost Regression"
    family: gradient_boosting
    library_target: "xgboost.XGBRegressor"
    hyperparameters:
      n_estimators: 400
      max_depth: 3
      learning_rate: 0.3
      note: "described as 'basic form' of XGBoost; only these three params stated"
    input_variable_set: "same 4 branches"

  - name: "LightGBM Regression"
    family: gradient_boosting
    library_target: "lightgbm.LGBMRegressor"
    hyperparameters:
      learning_rate: 0.1
      note: "described as 'basic form' of LightGBM; only learning_rate stated, rest default"
    input_variable_set: "same 4 branches"

validation_protocol:
  train_test_split: "80% train, 20% test"
  resampling:
    method: "k-fold cross-validation on the training set"
    folds: 30
    purpose: "generate 30 predicted values per test point to approximate a normal distribution for confidence-interval estimation (29 folds train, 1 fold validation, repeated per iteration, final prediction against the held-out 20% test set each time)"
  interval_method:
    type: "95% confidence interval"
    computation: "from the 30 predicted values per test-set point, compute mean/std and take a 95% CI; report the min and max of that CI as the predicted fare range (upper/lower bounds)"

metrics:
  primary: "R-squared (R2)"
  reported_results_table:
    - {model: MLR, variant: "correlation_analysis + listwise_deletion", value: 0.617, training_time_s: 21.98}
    - {model: MLR, variant: "correlation_analysis + mean_imputation", value: 0.607, training_time_s: 7.22}
    - {model: MLR, variant: "stepwise + listwise_deletion", value: 0.668, training_time_s: 30.60}
    - {model: MLR, variant: "stepwise + mean_imputation", value: 0.644, training_time_s: 23.39}
    - {model: DNN, variant: "correlation_analysis + listwise_deletion", value: 0.718, training_time_s: 97500}
    - {model: DNN, variant: "correlation_analysis + mean_imputation", value: 0.738, training_time_s: 93780}
    - {model: DNN, variant: "stepwise + listwise_deletion", value: 0.628, training_time_s: 115500}
    - {model: DNN, variant: "stepwise + mean_imputation", value: 0.843, training_time_s: 219780}
    - {model: XGBoost, variant: "correlation_analysis + listwise_deletion", value: 0.710, training_time_s: 492.41}
    - {model: XGBoost, variant: "correlation_analysis + mean_imputation", value: 0.695, training_time_s: 492.22}
    - {model: XGBoost, variant: "stepwise + listwise_deletion", value: 0.802, training_time_s: 1775.50}
    - {model: XGBoost, variant: "stepwise + mean_imputation", value: 0.776, training_time_s: 1393.70}
    - {model: LightGBM, variant: "correlation_analysis + listwise_deletion", value: 0.734, training_time_s: 67.60}
    - {model: LightGBM, variant: "correlation_analysis + mean_imputation", value: 0.727, training_time_s: 66.49}
    - {model: LightGBM, variant: "stepwise + listwise_deletion", value: 0.851, training_time_s: 176.90}
    - {model: LightGBM, variant: "stepwise + mean_imputation", value: 0.831, training_time_s: 143.94}

feature_importance:
  method: "SHAP (Shapley Additive exPlanations)"
  applied_to_model: "LightGBM, stepwise-method variable set (highest overall R2 branch)"
  headline_findings:
    - "linear_distance is the top contributor, with SHAP contribution greater than 50%"
    - "actual_distance, freight_weight, and vehicle_tonnage are also major contributors"
    - "linear_distance has a greater influence than actual_distance on shipping cost"
    - "precipitation shows no valid/significant contribution despite being engineered as a candidate feature"

open_questions:
  - "DNN activation functions, dropout, and loss function not stated"
  - "XGBoost/LightGBM regularization params, subsample, colsample not stated (paper says 'basic form')"
  - "Exact IQR/IQR-multiplier and exact random seed not stated"
